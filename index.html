<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BOTB Packing List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --fg:#1b2140; --muted:#5d6482; --line:#dde1ee;
  --navy:#1f2a5c; --gold:#c99a1e; --done:#2f7a4f; --done-bg:#e6f3ea; --warn:#a33a2a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11152a; --surface:#1a2040; --fg:#e8eaf4; --muted:#a3a9c6; --line:#2d3560;
  --navy:#9fb0ff; --gold:#e8bd4a; --done:#7fd3a0; --done-bg:#1d3a2c; --warn:#ff8a78; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0;color:var(--navy)}
.sub{color:var(--muted);font-size:14px;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.bar form{flex-wrap:nowrap}
.bar form input{flex:1 1 auto;width:0}
.bar form select{flex:0 1 38%;max-width:180px}
.bar button.btn{flex:none}
.mv{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:inherit;font-size:12px;font-weight:500;padding:4px 8px;cursor:pointer;flex:none}
li.moving{background:var(--bg)}
.mvbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.mvlabel{font-size:14px;color:var(--muted)}
.mvlabel b{color:var(--fg);font-weight:600}
.mvrow{display:flex;flex-wrap:wrap;gap:8px}
.mvrow select,.mvrow input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0;flex:1 1 140px}
.bar form.withname{flex-wrap:wrap}
.bar form #newname{flex:1 1 100%;width:auto}
.barrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-variant-numeric:tabular-nums}
.count{font-family:var(--display);font-size:22px;font-weight:700;color:var(--navy)}
.status{font-size:12px;color:var(--muted)}
.status.bad{color:var(--warn);font-weight:600}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--gold);transition:width .25s}
section{display:flex;flex-direction:column;gap:6px}
.who{display:flex;flex-direction:column;gap:14px;padding-top:16px;border-top:2px solid var(--navy)}
h2{font-family:var(--display);font-size:28px;font-weight:700;margin:0;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline}
h3{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.02em;margin:0;display:flex;justify-content:space-between;align-items:baseline}
h2 span,h3 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:flex;align-items:center;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
li input{width:22px;height:22px;accent-color:var(--done);flex:none;margin:0}
li.done{background:var(--done-bg)}
li.done .txt{color:var(--muted);text-decoration:line-through}
li.q .txt::after{content:"Find it first";margin-left:8px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);display:inline-block}
.rm{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:12px 14px;cursor:pointer}
form{display:flex;flex-wrap:wrap;gap:8px}
form input,form select{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
form input{flex:1 1 200px}
button.btn{font:inherit;font-size:15px;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:var(--surface);cursor:pointer}
button.ghost{background:none;color:var(--muted);border-color:var(--line);font-weight:500}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="root"><p class="empty">Loading the list…</p></main>
<script>
(function(){
  var STORE={owner:"TXRopePusher",repo:"botb-checklist-data",path:"checklist.json",branch:"main"};
  var TOKEN=(function(){var k="629f98ce2be1c0dc401807c795124790",b=atob("UVtNDkxaPBVTFjoAUnErKGJ1BmEAfxZQYAdkSkF/Q10FbWxVdU8NNn4hU1wleFQqDARVe1tHJXBIBXBDcG9qQUdcSjN/TDIJWQQydlp3NlZyYnJ0d2cybVxsdAYM"),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b.charCodeAt(i)^k.charCodeAt(i%k.length));return s;})();
  var API="https://api.github.com/repos/"+STORE.owner+"/"+STORE.repo+"/contents/"+STORE.path;
  function H(x){var h={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};for(var k in x)h[k]=x[k];return h;}
  function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o,null,1))));}
  function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s.replace(/\s/g,"")))));}
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  var base=null, sha=null, etag=null, pending=[], saving=false, timer=null, confirming=false, mv=null;
  var status={text:"Loading…",bad:false}, lastSync=0;
  var root=document.getElementById("root");

  function apply(st,ops){
    ops.forEach(function(o){
      if(o.k==="t")st.items.forEach(function(i){if(i.id===o.id)i.d=o.d;});
      else if(o.k==="a"){if(!st.items.some(function(i){return i.id===o.item.id;}))st.items.push(o.item);}
      else if(o.k==="r")st.items=st.items.filter(function(i){return i.id!==o.id;});
      else if(o.k==="z")st.items.forEach(function(i){i.d=false;});
      else if(o.k==="m")st.items.forEach(function(i){if(i.id!==o.id)return;if(o.p==="Blake"){delete i.p;if(!i.g)i.g="Added";}else i.p=o.p;});
    });
    return st;
  }
  function view(){return base?apply(clone(base),pending):null;}

  function setStatus(t,bad){status={text:t,bad:!!bad};var el=document.getElementById("status");if(el){el.textContent=t;el.className="status"+(bad?" bad":"");}}

  function render(){
    var st=view(); if(!st)return;
    var active=document.activeElement, draft=document.getElementById("newtxt"), draftVal=draft?draft.value:"", grpVal=(document.getElementById("newgrp")||{}).value, nameEl=document.getElementById("newname"), nameVal=nameEl?nameEl.value:"", focusId=active&&active.id;
    var done=st.items.filter(function(i){return i.d;}).length,total=st.items.length,pct=total?Math.round(done/total*100):0;
    var h='<header><h1>BOTB Packing List</h1><p class="sub">Saturday, Nov. 14, Selah Ridge</p></header>';
    h+='<div class="bar"><div class="barrow"><span class="count">'+done+' of '+total+' packed</span><span id="status" class="status'+(status.bad?' bad':'')+'">'+esc(status.text)+'</span></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div>@@FORM@@</div>';
    function P(i){return i.p||"Blake";}
    var people=(st.people||[]).slice(); st.items.forEach(function(i){if(people.indexOf(P(i))<0)people.push(P(i));});
    var opts=[];
    function list(items){var s="<ul>";items.forEach(function(i){
      if(mv&&mv.id===i.id){
        s+='<li class="moving"><div class="mvbox"><span class="mvlabel">Move <b>'+esc(i.t)+'</b> to</span><div class="mvrow"><select id="mvsel" aria-label="Move to">';
        people.forEach(function(p){s+='<option value="'+esc(p)+'"'+(mv.sel===p?" selected":"")+'>'+esc(p)+'</option>';});
        s+='<option value="__new"'+(mv.sel==="__new"?" selected":"")+'>Someone new…</option></select>';
        if(mv.sel==="__new")s+='<input id="mvname" placeholder="Their name" aria-label="Their name" autocomplete="off" value="'+esc(mv.name)+'">';
        s+='</div><div class="mvrow"><button class="btn" id="mv-save" type="button">Move</button><button class="btn ghost" id="mv-cancel" type="button">Cancel</button></div></div></li>';
        return;
      }
      s+='<li class="'+(i.d?"done ":"")+(i.q&&!i.d?"q":"")+'"><label><input type="checkbox" data-id="'+esc(i.id)+'"'+(i.d?" checked":"")+'><span class="txt">'+esc(i.t)+'</span></label><button class="mv" data-mv="'+esc(i.id)+'" aria-label="Move '+esc(i.t)+' to someone else">Move</button><button class="rm" data-rm="'+esc(i.id)+'" aria-label="Remove '+esc(i.t)+'">×</button></li>';});return s+"</ul>";}
    people.forEach(function(p){
      var mine=st.items.filter(function(i){return P(i)===p;}); if(!mine.length&&p!=="Blake")return;
      var pd=mine.filter(function(i){return i.d;}).length;
      h+='<div class="who"><h2>'+esc(p)+'<span>'+pd+'/'+mine.length+'</span></h2>';
      if(p!=="Blake"){h+=list(mine)+"</div>";opts.push({v:p+"|",l:p});return;}
      opts.push({v:"Blake|Added",l:"Blake"});
      var groups=(st.groups||[]).slice(); mine.forEach(function(i){if(groups.indexOf(i.g)<0)groups.push(i.g);});
      groups.forEach(function(g){
        var items=mine.filter(function(i){return i.g===g;}); if(!items.length)return;
        var gd=items.filter(function(i){return i.d;}).length;
        h+='<section><h3>'+esc(g)+'<span>'+gd+'/'+items.length+'</span></h3>'+list(items)+'</section>';
      });
      h+="</div>";
    });
    opts.push({v:"__new",l:"Someone new…"});
    var isNew=grpVal==="__new";
    var f='<form id="add" class="'+(isNew?"withname":"")+'"><input id="newtxt" placeholder="Add an item" aria-label="New item" autocomplete="off"><select id="newgrp" aria-label="Whose list">';
    opts.forEach(function(o){f+='<option value="'+esc(o.v)+'">'+esc(o.l)+'</option>';});
    f+='</select><button class="btn" type="submit">Add</button>'+(isNew?'<input id="newname" placeholder="Their name" aria-label="Their name" autocomplete="off">':'')+'</form>';
    h=h.replace("@@FORM@@",f);
    h+='<div class="foot">'+(confirming?'<span class="confirm">Uncheck all '+total+' items for everyone?</span><button class="btn" id="reset-yes" type="button">Uncheck all</button><button class="btn ghost" id="reset-no" type="button">Cancel</button>':'<button class="btn ghost" id="reset" type="button">Uncheck everything</button>')+'</div>';
    var y=window.scrollY; root.innerHTML=h; window.scrollTo(0,y);
    var nd=document.getElementById("newtxt"); nd.value=draftVal;
    var sel=document.getElementById("newgrp"); if(grpVal&&[].some.call(sel.options,function(o){return o.value===grpVal;}))sel.value=grpVal;
    var nn=document.getElementById("newname"); if(nn)nn.value=nameVal;
    if(focusId==="newtxt"||focusId==="newname"||focusId==="mvname"){var fe=document.getElementById(focusId);if(fe)fe.focus();}
  }

  function load(){
    var hd=H({}); if(etag)hd["If-None-Match"]=etag;
    return fetch(API+"?ref="+STORE.branch+"&t="+Date.now(),{headers:hd,cache:"no-store"}).then(function(r){
      if(r.status===304){lastSync=Date.now();return false;}
      if(r.status===401||r.status===403||r.status===404)throw {auth:true,status:r.status};
      if(!r.ok)throw {status:r.status};
      etag=r.headers.get("ETag");
      return r.json().then(function(j){sha=j.sha;base=dec(j.content);lastSync=Date.now();return true;});
    });
  }

  function flush(){
    if(saving||!pending.length)return;
    saving=true; setStatus("Saving…");
    var ops=pending.slice(), tries=0;
    function attempt(){
      var next=apply(clone(base),ops);
      return fetch(API,{method:"PUT",headers:H({"Content-Type":"application/json"}),body:JSON.stringify({message:"Checklist update",content:enc(next),sha:sha,branch:STORE.branch})}).then(function(r){
        if(r.ok)return r.json().then(function(j){sha=j.content.sha;base=next;etag=null;pending=pending.slice(ops.length);lastSync=Date.now();setStatus("Saved");});
        if((r.status===409||r.status===422)&&tries++<4){etag=null;return load().then(attempt);}
        throw {status:r.status};
      });
    }
    attempt().catch(function(e){setStatus(e&&e.auth?"Can't save. Tell Blake the link stopped working.":"Couldn't save. Retrying…",true);}).then(function(){
      saving=false; render(); if(pending.length)timer=setTimeout(flush,2500);
    });
  }
  function queue(op){pending.push(op);render();clearTimeout(timer);timer=setTimeout(flush,500);}

  root.addEventListener("input",function(e){if(e.target.id==="mvname"&&mv)mv.name=e.target.value;});
  root.addEventListener("change",function(e){if(e.target.id==="mvsel"&&mv){mv.sel=e.target.value;render();if(mv.sel==="__new"){var m=document.getElementById("mvname");if(m)m.focus();}return;}if(e.target.id==="newgrp"){render();if(e.target.value==="__new"){var n=document.getElementById("newname");if(n)n.focus();}return;}var id=e.target.getAttribute&&e.target.getAttribute("data-id");if(id)queue({k:"t",id:id,d:e.target.checked});});
  root.addEventListener("click",function(e){
    var t=e.target, rm=t.getAttribute&&t.getAttribute("data-rm");
    if(rm){queue({k:"r",id:rm});return;}
    var mvId=t.getAttribute&&t.getAttribute("data-mv");
    if(mvId){var it0=(view().items.filter(function(i){return i.id===mvId;})[0])||{};mv={id:mvId,sel:it0.p||"Blake",name:""};render();return;}
    if(t.id==="mv-cancel"){mv=null;render();return;}
    if(t.id==="mv-save"&&mv){
      var to=mv.sel;
      if(to==="__new"){to=(mv.name||"").trim();if(!to){var mn=document.getElementById("mvname");if(mn){mn.placeholder="Type their name first";mn.focus();}return;}to=to.charAt(0).toUpperCase()+to.slice(1);if(to.toLowerCase()==="blake")to="Blake";}
      var id0=mv.id; mv=null; queue({k:"m",id:id0,p:to}); return;
    }
    if(t.id==="reset"){confirming=true;render();return;}
    if(t.id==="reset-no"){confirming=false;render();return;}
    if(t.id==="reset-yes"){confirming=false;queue({k:"z"});}
  });
  root.addEventListener("submit",function(e){
    e.preventDefault();
    var inp=document.getElementById("newtxt"),txt=inp.value.trim(); if(!txt)return;
    var sv=document.getElementById("newgrp").value, it={id:"n"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:txt,d:false};
    if(sv==="__new"){
      var ne=document.getElementById("newname"), nm=ne?ne.value.trim():"";
      if(!nm){if(ne){ne.focus();ne.placeholder="Type their name first";}return;}
      nm=nm.charAt(0).toUpperCase()+nm.slice(1);
      if(nm.toLowerCase()==="blake")it.g="Added"; else it.p=nm;
      inp.value=""; queue({k:"a",item:it});
      document.getElementById("newgrp").value=nm.toLowerCase()==="blake"?"Blake|Added":nm+"|"; render();
      return;
    }
    var v=sv.split("|");
    if(v[0]==="Blake")it.g=v[1]; else it.p=v[0];
    inp.value=""; queue({k:"a",item:it});
  });

  function poll(){
    if(saving||pending.length||document.hidden)return;
    load().then(function(changed){if(changed)render();setStatus("Up to date");}).catch(function(e){setStatus(e&&e.auth?"Can't load. Tell Blake the link stopped working.":"Offline. Retrying…",true);});
  }
  load().then(function(){setStatus("Up to date");render();}).catch(function(e){
    root.innerHTML='<p class="empty">'+(e&&e.auth?"This list's access key isn't working. Tell Blake.":"Couldn't load the list. Check your signal and reload.")+'</p>';
  });
  setInterval(poll,5000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)poll();});
})();
</script>
</body>
</html>
